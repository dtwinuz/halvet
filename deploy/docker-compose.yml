services:
  halvet-site:
    image: caddy:2-alpine
    container_name: halvet-site
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
    networks:
      - edge

# dtwin edge Caddy shu tarmoqda: halvet.dtwin.uz -> halvet-site:80
networks:
  edge:
    external: true
    name: dtwin-prod_default
